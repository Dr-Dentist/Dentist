<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Patient Login | Dr. Asim Prakash Dental Clinic</title>
  <meta name="description" content="Patient login for Dr. Asim Prakash Dental Clinic, Araria. Sign in to view your appointments, treatment plan and reports."/>
  <meta name="robots" content="noindex, follow"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <link href="assets/css/lumora.css?v=20260904b" rel="stylesheet" type="text/css"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="assets/css/toggles.css?v=20260904b" rel="stylesheet" type="text/css"/>
  <link href="assets/img/favicon.svg?v=2" rel="icon" type="image/svg+xml"/>
  <link href="assets/img/favicon.svg?v=2" rel="apple-touch-icon"/>
  <script>(function(){try{var t=localStorage.getItem("dapdc_theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("lang","en");document.documentElement.setAttribute("dir","ltr");}catch(e){}})();</script>
  <style>
    :root{--auth-bg:#F6F6F6;--auth-card:#ffffff;--auth-ink:#091F5B;--auth-mut:#5d6c7b;--auth-line:#d3e0f2;--auth-accent:#31538F;}
    :root[data-theme="dark"]{--auth-bg:#081231;--auth-card:#0d1c45;--auth-ink:#eaf1fb;--auth-mut:#9caed0;--auth-line:rgba(255,255,255,.14);--auth-accent:#6F96D1;}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--auth-bg);color:var(--auth-ink);font-family:Sora,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    .auth-top *,.auth-wrap *,body{letter-spacing:normal;}
    .auth-card h1{letter-spacing:-.3px;}
    /* neutralise lumora.css bare "img{width:100%;object-fit:cover;aspect-ratio:1}" */
    .auth-top img,.auth-card>img{width:auto!important;height:auto!important;max-width:100%;object-fit:contain!important;aspect-ratio:auto!important;display:inline-block;}
    .auth-top img{height:30px!important;}
    :root[data-theme="dark"] .auth-top img{filter:brightness(0) invert(1);}
    .auth-card>img{width:42px!important;height:42px!important;}
    .auth-top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1100px;margin:0 auto;width:100%;box-sizing:border-box;}
    .auth-top a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--auth-mut);font-size:14px;}
    .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 64px;}
    .auth-card{width:100%;max-width:400px;background:var(--auth-card);border:1px solid var(--auth-line);border-radius:20px;padding:32px 28px;box-shadow:0 24px 60px -30px rgba(1,31,35,.25);}
    .auth-card h1{font-size:22px;margin:14px 0 4px;letter-spacing:-.3px;}
    .auth-card .sub{color:var(--auth-mut);font-size:14px;margin:0 0 22px;}
    .fld{margin-bottom:14px;}
    .fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
    .fld input{width:100%;box-sizing:border-box;padding:12px 14px;font:inherit;font-size:15px;color:inherit;background:transparent;border:1px solid var(--auth-line);border-radius:10px;outline:none;}
    input[type=checkbox]{accent-color:var(--auth-accent);}
    .fld input:focus{border-color:var(--auth-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--auth-accent) 22%,transparent);}
    .fld .fld-err{display:none;color:#e5484d;font-size:12.5px;margin-top:5px;}
    .fld.invalid .fld-err{display:block;}
    .fld.invalid input{border-color:#e5484d;}
    .row-between{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px;font-size:13px;}
    .row-between a,.link-btn{color:var(--auth-accent);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer;}
    .btn{width:100%;padding:13px 18px;font:inherit;font-weight:600;font-size:15px;border-radius:999px;border:0;cursor:pointer;}
    .btn-primary{background:#091F5B;color:#fff;}
    :root[data-theme="dark"] .btn-primary{background:#17285e;color:#eaf1fb;border:1px solid var(--auth-line);}
    .btn-google{margin-top:10px;background:transparent;border:1px solid var(--auth-line);color:inherit;display:flex;align-items:center;justify-content:center;gap:10px;}
    .msg{display:none;margin:0 0 16px;padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.4;}
    .msg.err{display:block;background:rgba(229,72,77,.12);color:#e5484d;border:1px solid rgba(229,72,77,.3);}
    .msg.ok{display:block;background:rgba(37,161,120,.14);color:#1f9d64;border:1px solid rgba(37,161,120,.3);}
    .msg.info{display:block;background:color-mix(in srgb,var(--auth-accent) 12%,transparent);color:var(--auth-accent);border:1px solid color-mix(in srgb,var(--auth-accent) 30%,transparent);}
    .auth-foot{text-align:center;color:var(--auth-mut);font-size:13px;margin-top:20px;}
    .auth-foot a{color:var(--auth-accent);text-decoration:none;}
    .divider{display:flex;align-items:center;gap:12px;color:var(--auth-mut);font-size:12px;margin:18px 0;}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--auth-line);}
  </style>
</head>
<body>
  <div class="auth-top">
    <a href="index.html">&larr; Back to website</a>
    <img src="assets/img/lumora-logo.svg?v=3" alt="Dr. Asim Prakash Dental Clinic" height="30" style="height:30px;width:auto"/>
  </div>

  <div class="auth-wrap">
    <form class="auth-card" id="loginForm" novalidate>
      <img src="assets/img/favicon.svg?v=2" alt="" width="40" height="40" style="border-radius:10px"/>
      <h1>Patient Login</h1>
      <p class="sub">Sign in to see your appointments, treatment plan and reports.</p>

      <div class="msg" id="loginMsg" role="alert"></div>

      <div class="fld" id="fld-email">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com"/>
        <div class="fld-err">Enter a valid email address.</div>
      </div>

      <div class="fld" id="fld-pass">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password"/>
        <div class="fld-err">Password must be at least 6 characters.</div>
      </div>

      <div class="row-between">
        <label style="display:flex;gap:6px;align-items:center;font-weight:400;color:var(--auth-mut)">
          <input type="checkbox" id="remember" checked style="width:auto"/> Remember me
        </label>
        <button type="button" class="link-btn" id="forgotLink">Forgot password?</button>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>

      <div class="divider">or</div>
      <button type="button" class="btn btn-google" id="googleBtn">
        <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.4-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.9z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.1-5.5c-2 1.3-4.6 2.1-8.1 2.1-6.4 0-11.7-3.7-13.6-8.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>

      <p class="auth-foot">Not a registered patient yet?<br/>
        <a href="tel:+917764014465">Call +91 77640&nbsp;14465</a> or
        <a href="https://wa.me/917764014465?text=Hi%2C%20I%27d%20like%20to%20register%20as%20a%20patient." target="_blank" rel="noopener">message us on WhatsApp</a>.
      </p>
    </form>
  </div>

  <!-- ============================================================
       SUPABASE AUTH  —  set the two values below to go live.
       Project → Settings → API → Project URL + anon public key.
       ============================================================ -->
  <script>
    var SUPABASE_URL = "";          // e.g. https://xxxx.supabase.co
    var SUPABASE_ANON_KEY = "";     // e.g. eyJhbGciOi...
  </script>
  <script>
  (function () {
    var form = document.getElementById("loginForm");
    var msg  = document.getElementById("loginMsg");
    var btn  = document.getElementById("loginBtn");
    var sb   = null;

    function showMsg(kind, text) { msg.className = "msg " + kind; msg.textContent = text; }
    function clearMsg() { msg.className = "msg"; msg.textContent = ""; }
    function setInvalid(id, bad) { document.getElementById(id).classList.toggle("invalid", !!bad); }

    function validate() {
      var email = document.getElementById("email").value.trim();
      var pass  = document.getElementById("password").value;
      var okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      var okPass  = pass.length >= 6;
      setInvalid("fld-email", !okEmail);
      setInvalid("fld-pass", !okPass);
      return okEmail && okPass ? { email: email, pass: pass } : null;
    }
    ["email", "password"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", function () {
        this.closest(".fld").classList.remove("invalid"); clearMsg();
      });
    });

    function loadSupabase(cb) {
      if (sb) return cb(sb);
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return cb(null);
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = function () {
        try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { sb = null; }
        cb(sb);
      };
      s.onerror = function () { cb(null); };
      document.head.appendChild(s);
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      clearMsg();
      var v = validate();
      if (!v) { showMsg("err", "Please fix the highlighted fields and try again."); return; }

      btn.disabled = true; btn.textContent = "Signing in…";
      loadSupabase(function (client) {
        if (!client) {
          btn.disabled = false; btn.textContent = "Sign in";
          showMsg("info", "Login is not connected yet. The clinic is setting this up — for now please call or WhatsApp +91 77640 14465.");
          return;
        }
        client.auth.signInWithPassword({ email: v.email, password: v.pass }).then(function (res) {
          btn.disabled = false; btn.textContent = "Sign in";
          if (res.error) { showMsg("err", res.error.message || "That email and password did not match."); return; }
          showMsg("ok", "Signed in. Redirecting…");
          setTimeout(function () { window.location.href = "index.html"; }, 900);
        }).catch(function () {
          btn.disabled = false; btn.textContent = "Sign in";
          showMsg("err", "Something went wrong. Please try again in a moment.");
        });
      });
    });

    document.getElementById("googleBtn").addEventListener("click", function () {
      clearMsg();
      loadSupabase(function (client) {
        if (!client) { showMsg("info", "Google sign-in is not connected yet. Please call or WhatsApp +91 77640 14465."); return; }
        client.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin + "/index.html" } });
      });
    });

    document.getElementById("forgotLink").addEventListener("click", function () {
      var email = document.getElementById("email").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setInvalid("fld-email", true);
        showMsg("err", "Enter your email address above first, then click “Forgot password?”.");
        return;
      }
      loadSupabase(function (client) {
        if (!client) { showMsg("info", "Password reset is not connected yet. Please call the clinic on +91 77640 14465."); return; }
        client.auth.resetPasswordForEmail(email).then(function () {
          showMsg("ok", "If that email is registered, a reset link is on its way.");
        });
      });
    });
  })();
  </script>

</body>
